name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the parity guards: TypeScript against SQL, and TypeScript
      # against the Dart port. Both parse source as text, so neither needs a
      # database or a Dart SDK on this runner.
      - run: npm test
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a throwaway Postgres and runs the SQL
      # assertions: RLS coverage, state machine guards, money invariants,
      # append-only audit trail, server-only evidence writes.
      - run: npm run test:db

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # The Edge Function is the only entry point that reaches production, and
      # it compiles under Deno rather than tsc, so nothing else checks it. The
      # vendoring step is what gives it real types instead of `any`; if that
      # script breaks, this job is where it shows.
      - run: ./scripts/vendor-shared.sh
      - run: deno check --config supabase/functions/deno.json supabase/functions/resolve-dispute/index.ts

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/core-dart
      - run: dart analyze --fatal-infos
        working-directory: packages/core-dart
      - run: dart test
        working-directory: packages/core-dart

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      # Widget tests pin the rule that matters in the UI: the actions offered
      # are exactly what the shared state machine allows for that role, and no
      # single party can close a dispute alone.
      - run: flutter test
        working-directory: apps/mobile
