name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a throwaway Postgres and runs the SQL
      # assertions: RLS coverage, state machine guards, money invariants,
      # append-only audit trail.
      - run: npm run test:db
