# Builds an APK somebody can actually install.
#
# Run it from the Actions tab: "Build the Android app" -> Run workflow. The
# APK comes back as an artifact on the run.
#
# Why here rather than on a laptop. The local build could not reach Maven at
# all: the network in front of it inspects TLS, and the JVM does not trust the
# certificate that inspection presents, so every dependency failed with PKIX
# path building failed. A runner has no such proxy. It also means the APK a
# tester installs comes from a commit anybody can point at, rather than from
# whatever happened to be on one machine that day.
#
# Signing. Without the four secrets below the release build is unsigned and
# fails, which is deliberate: an APK signed with the debug key looks finished,
# can never be uploaded to Play under that key, and forces every tester holding
# one to uninstall before a real build will install over it.
#
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Windows, straight onto the clipboard and already clean:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\trustiq-upload.jks")) | Set-Clipboard
# macOS or Linux:
#   base64 -i trustiq-upload.jks | tr -d '\n'
#
# Not certutil -encode: it wraps the output in BEGIN and END lines that have
# to be stripped by hand, and a stray one reaches the runner and fails at
# base64 -d with an error that says nothing about where it came from.
#
# SUPABASE_URL and SUPABASE_ANON_KEY are repository variables, not secrets. The
# publishable key is designed to be readable: it ships inside the APK either
# way, and pretending otherwise would be theatre. It is a variable rather than
# a literal here so the build can be pointed at another project without a
# commit. The service-role key must never appear in either place, and the build
# script refuses one on sight.

name: Build the Android app

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Which build
        type: choice
        default: release
        options: [release, debug]
      split:
        description: One APK per architecture (smaller, three files)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Say what is missing before spending twenty minutes finding out
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing SUPABASE_URL(variable)"
          [ -n "$KEY" ] || missing="$missing SUPABASE_ANON_KEY(variable)"
          if [ "${{ inputs.flavour }}" = "release" ] && [ -z "$KEYSTORE" ]; then
            missing="$missing ANDROID_KEYSTORE_BASE64(secret)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Not configured yet:$missing. Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Write the signing config
        if: inputs.flavour == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Written with printf rather than a heredoc so a password containing
          # a dollar sign or a backtick survives intact.
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > apps/mobile/android/key.properties

      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TRUSTIQ_VERIFY_CONTACT: ${{ vars.TRUSTIQ_VERIFY_CONTACT }}
        run: |
          # The same script used locally, so there is one definition of what a
          # TrustIQ build is. It reads .env, which does not exist on a runner,
          # so the values are written to one here from the repository settings.
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'TRUSTIQ_VERIFY_CONTACT=%s\n' "$TRUSTIQ_VERIFY_CONTACT"
          } > .env
          node scripts/build-android.mjs \
            ${{ inputs.flavour == 'debug' && '--debug' || '' }} \
            ${{ inputs.split && '--split' || '' }}

      - name: Take the keystore and the .env back off the runner
        if: always()
        run: rm -f apps/mobile/android/key.properties "$RUNNER_TEMP/upload.jks" .env

      - uses: actions/upload-artifact@v4
        with:
          name: trustiq-${{ inputs.flavour }}-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
