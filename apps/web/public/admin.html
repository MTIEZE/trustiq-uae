<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TrustIQ Control Centre</title>
<!--
  The operator's console.

  It carries no authority of its own. Every panel below is one function in
  supabase/migrations, each of which refuses any caller who is not in
  app.admins, a table no client can write to. This page is a form and some
  arithmetic in front of a door the database keeps.

  Everything that returns a person's details writes an access log row before it
  answers: who looked, at whom, and what they searched for. That log is
  append-only and an operator cannot read it. It is the price of this page
  being allowed to show names at all, and it is charged in the database rather
  than promised here.

  No SDK, no CDN, no framework. A page where somebody types the password to an
  account that can read the whole platform is the last place to load a script
  from a host we do not control.

  The session lives in memory. Closing the tab signs you out.
-->
<style>
  :root {
    --bg: #F5F7F7; --surface: #FFFFFF; --sunken: #F7F9F9;
    --border: #E4E9E9; --border-strong: #D1DADA;
    --accent: #0D5F66; --accent-soft: #E3EFEF; --on-accent: #FFFFFF;
    --text: #0E1518; --dim: #4A575E; --faint: #7C8890;
    --ok: #3B6438; --ok-soft: #E7F0E5;
    --warn: #8A6110; --warn-soft: #F8F1DE;
    --bad: #9E3323; --bad-soft: #F8E9E6;
    --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1214; --surface: #151C1E; --sunken: #1A2325;
      --border: #222B2D; --border-strong: #2F3B3D;
      --accent: #4FBFC7; --accent-soft: #10312F; --on-accent: #06191B;
      --text: #E9EEEE; --dim: #A6B3B5; --faint: #78868A;
      --ok: #7FBE7A; --ok-soft: #17281A;
      --warn: #D9A94E; --warn-soft: #2A2314;
      --bad: #E38878; --bad-soft: #2E1A17;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; letter-spacing: -.015em; }
  p { margin: 0 0 12px; color: var(--dim); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button, input {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 6px; padding: 9px 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600;
  }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button[disabled] { opacity: .5; cursor: default; }
  input:focus { outline: none; border-color: var(--accent); }

  /* ---- shell ---- */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } }

  .side {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 22px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  @media (max-width: 820px) {
    .side { border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; overflow-x: auto; }
  }
  .brand { font-size: 17px; font-weight: 700; padding: 0 10px 18px; }
  .brand span { color: var(--accent); }
  .side nav { display: contents; }
  .tab {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 10px; border-radius: 6px; border: none; background: none;
    color: var(--dim); font-size: 14.5px; text-align: left; white-space: nowrap;
  }
  .tab:hover { background: var(--sunken); border-color: transparent; }
  .tab[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tab .count {
    font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 20px;
    background: var(--warn-soft); color: var(--warn);
  }
  .side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--border); }
  @media (max-width: 820px) { .side-foot { display: none; } }
  .who { font-family: var(--mono); font-size: 11.5px; color: var(--faint); word-break: break-all; }

  main { padding: 28px 30px 80px; max-width: 1100px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .head h2 { font-size: 21px; }
  .head .spacer { flex: 1; }
  .lede { margin-bottom: 22px; max-width: 70ch; }

  /* ---- states ---- */
  .note {
    padding: 14px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 14.5px;
    background: var(--sunken); border: 1px solid var(--border);
  }
  .note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .empty {
    padding: 44px 20px; text-align: center; color: var(--faint);
    border: 1px dashed var(--border-strong); border-radius: 10px;
  }
  .loading { color: var(--faint); padding: 20px 0; }

  /* ---- numbers ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px 17px; }
  .tile .n { font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 12.5px; color: var(--faint); margin-top: 3px; }
  .tile .sub { font-size: 12px; color: var(--dim); margin-top: 6px; }

  .thesis {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 8px; padding: 20px 22px; margin-bottom: 26px;
  }
  .thesis .n { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  .thesis .k { font-size: 13.5px; color: var(--dim); margin-top: 8px; max-width: 58ch; }

  /* ---- tables ---- */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
  th, td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  th {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; border-bottom-color: var(--border-strong);
  }
  /* Right aligned, but only flush when it is the last column. Written as a
     flat padding-right: 0 it made the contracts count collide with the action
     buttons in the next cell. */
  td.n, th.n { text-align: right; padding-right: 18px; font-variant-numeric: tabular-nums; }
  td.n:last-child, th.n:last-child { padding-right: 0; }
  tbody tr:hover { background: var(--sunken); }
  .mono { font-family: var(--mono); font-size: 12.5px; color: var(--faint); }

  .pill {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
  }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.flat { background: var(--sunken); color: var(--faint); }

  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-actions button { padding: 5px 10px; font-size: 13px; }

  .search { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .search input { flex: 1 1 240px; min-width: 0; }

  .gate { max-width: 340px; display: grid; gap: 14px; margin: 12vh auto; }
  .gate h1 { font-size: 22px; }

  dialog {
    border: 1px solid var(--border); border-radius: 10px; padding: 24px 26px;
    background: var(--surface); color: var(--text); max-width: 460px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h3 { font-size: 17px; margin-bottom: 10px; }
  dialog input { width: 100%; margin: 10px 0 16px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<form class="gate" id="gate">
  <h1>TrustIQ <span style="color:var(--accent)">Control Centre</span></h1>
  <p class="mono" id="host"></p>
  <div id="problem" class="note bad hidden"></div>
  <div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required style="width:100%;margin-top:6px">
  </div>
  <div>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required style="width:100%;margin-top:6px">
  </div>
  <button class="primary" type="submit" id="go">Sign in</button>
  <p style="font-size:13px;color:var(--faint)">
    Your ordinary TrustIQ account. Being an operator is a row in a table only
    SQL can write to; signing in is not enough.
  </p>
</form>

<div class="shell hidden" id="shell">
  <aside class="side">
    <div class="brand">Trust<span>IQ</span></div>
    <nav id="tabs"></nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <button style="margin-top:10px;width:100%" id="out">Sign out</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<style>
  #ask-hint { margin: 6px 0 0; font-size: 12.5px; color: var(--faint); min-height: 18px; }
  #ask-hint[data-short="1"] { color: var(--amber); }
</style>
<dialog id="ask">
  <h3 id="ask-title"></h3>
  <p id="ask-body"></p>
  <label class="mono" for="ask-reason" id="ask-label">Reason</label>
  <input id="ask-reason" type="text" maxlength="200">
  <p id="ask-hint"></p>
  <div class="dialog-actions">
    <button id="ask-no">Cancel</button>
    <button class="primary" id="ask-yes">Confirm</button>
  </div>
</dialog>

<script>
(function () {
  'use strict'

  var URL_ = 'https://ieccihxvmlapfuhbjuxf.supabase.co'
  var KEY = 'sb_publishable_LvMn5CI5ZJJLt6aXaACbcQ_tE237fV4'
  var token = null

  var $ = function (id) { return document.getElementById(id) }
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }
  var n = function (v) { return Number(v || 0).toLocaleString('en-GB') }
  var day = function (v) { return v ? String(v).slice(0, 10) : '—' }

  $('host').textContent = URL_.replace(/^https?:\/\//, '')

  function rpc (name, body) {
    return fetch(URL_ + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        apikey: KEY,
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body || {}),
    }).then(function (r) {
      return r.json().then(function (data) {
        if (r.ok) return data
        // Postgres carries our own refusal in `message`. Passing it through
        // beats inventing a friendlier one that says less.
        var e = new Error(data && data.message ? data.message : 'HTTP ' + r.status)
        e.status = r.status
        throw e
      })
    })
  }

  /* ---------------------------------------------------------------- *
   * Asking before anything irreversible
   *
   * Every one of these takes a reason, and the reason is not decoration:
   * the database refuses a suspension without one, and it lands in the
   * access log next to who did it.
   * ---------------------------------------------------------------- */
  function ask (opts) {
    return new Promise(function (resolve) {
      $('ask-title').textContent = opts.title
      $('ask-body').textContent = opts.body
      $('ask-label').textContent = opts.label || 'Reason'
      $('ask-reason').value = ''

      // The floor, said out loud. Under ten characters the confirm button used
      // to put the focus back in the field and return, silently, which reads
      // exactly like a button that does not work — and this panel has already
      // had one of those.
      var hint = $('ask-hint')
      function say () {
        var n = $('ask-reason').value.trim().length
        if (n === 0) {
          hint.textContent = 'At least 10 characters. They read this, word for word.'
          hint.dataset.short = '1'
        } else if (n < 10) {
          hint.textContent = (10 - n) + ' more character' + (10 - n === 1 ? '' : 's') + ' needed.'
          hint.dataset.short = '1'
        } else {
          hint.textContent = 'This is emailed to them and kept on the record.'
          delete hint.dataset.short
        }
      }
      $('ask-reason').oninput = say
      say()
      $('ask-yes').textContent = opts.confirm || 'Confirm'
      $('ask-yes').className = opts.danger ? 'danger' : 'primary'

      var dlg = $('ask')
      function done (value) {
        dlg.close()
        $('ask-yes').onclick = null
        $('ask-no').onclick = null
        $('ask-reason').oninput = null
        resolve(value)
      }
      $('ask-yes').onclick = function () {
        var reason = $('ask-reason').value.trim()
        if (reason.length < 10) {
          say()
          $('ask-reason').focus()
          return
        }
        done(reason)
      }
      $('ask-no').onclick = function () { done(null) }
      dlg.showModal()
    })
  }

  /* ---------------------------------------------------------------- *
   * The sections
   * ---------------------------------------------------------------- */

  var TABS = [
    { id: 'overview', label: 'Overview' },
    { id: 'verification', label: 'Verification', badge: 'pending' },
    { id: 'people', label: 'People' },
    { id: 'reports', label: 'Reports' },
    { id: 'disputes', label: 'Disputes' },
    { id: 'activity', label: 'Activity' },
  ]

  var current = 'overview'
  var badges = {}

  function drawTabs () {
    $('tabs').innerHTML = TABS.map(function (t) {
      var badge = t.badge && badges[t.badge]
        ? '<span class="count">' + n(badges[t.badge]) + '</span>' : ''
      return '<button class="tab" data-tab="' + t.id + '" aria-current="' +
        (current === t.id) + '">' + esc(t.label) + badge + '</button>'
    }).join('')
    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.onclick = function () { show(b.dataset.tab) }
    })
  }

  function frame (title, lede, body) {
    return '<div class="head"><h2>' + esc(title) + '</h2></div>' +
      (lede ? '<p class="lede">' + lede + '</p>' : '') + body
  }

  function fail (e) {
    if (e.status === 403 || /operator action/.test(e.message)) {
      return '<div class="note bad">Signed in, but this account is not on the operator list. ' +
        'That list is only writable from SQL, which is the point of it.</div>'
    }
    return '<div class="note bad">' + esc(e.message) + '</div>'
  }

  var SECTIONS = {}

  SECTIONS.overview = function () {
    return Promise.all([rpc('admin_overview'), rpc('admin_ai_quality'),
      rpc('admin_verification_pending'), rpc('admin_beta_waiting')])
      .then(function (r) {
        var o = Array.isArray(r[0]) ? r[0][0] : r[0]
        var ai = r[1] || []
        badges.pending = r[2]
        drawTabs()

        var issued = Number(o.proposals_issued || 0)
        var agreed = Number(o.proposals_accepted || 0)
        var head, note
        if (issued === 0) {
          head = 'No proposals yet'
          note = 'The acceptance rate is the number this product lives on: a resolution only ' +
            'ends a dispute if both parties accept it. Nothing to measure until the model has ' +
            'been asked.'
        } else if (issued < 10) {
          head = agreed + ' of ' + issued + ' accepted'
          note = 'Too few to be a rate. ' + n(o.proposals_half_accepted) +
            ' had one party accept and the other not, and ' + n(o.escalated_to_human) +
            ' disputes went to a human.'
        } else {
          head = Math.round((agreed / issued) * 100) + '%'
          note = agreed + ' of ' + issued + ' proposals accepted by both parties. ' +
            n(o.proposals_half_accepted) + ' by one only, ' + n(o.escalated_to_human) +
            ' escalated.'
        }

        function tile (v, k, sub) {
          return '<div class="tile"><div class="n">' + v + '</div><div class="k">' + k +
            '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>'
        }

        var rows = ai.map(function (x) {
          return '<tr><td>' + esc(x.outcome) + '</td><td class="n">' + n(x.calls) +
            '</td><td class="n">' + (x.mean_confidence == null ? '—' : x.mean_confidence) +
            '</td><td class="n">' + (x.mean_latency_ms == null ? '—' : n(x.mean_latency_ms) + ' ms') +
            '</td><td class="n mono">' + day(x.last_call) + '</td></tr>'
        }).join('')

        return frame('Overview', 'Counts only. Nothing on this screen names anybody.',
          '<div class="thesis"><div class="n">' + esc(head) + '</div>' +
          '<div class="k">' + esc(note) + '</div></div>' +
          '<div class="tiles">' +
            tile(n(o.people), 'accounts', n(o.verified) + ' verified') +
            tile(n(o.active_today), 'here today') +
            tile(n(o.active_7d), 'here this week') +
            tile(n(o.active_30d), 'here this month') +
            tile(n(r[2]), 'awaiting verification') +
            tile(n(r[3]), 'on the beta list') +
          '</div>' +
          '<div class="tiles">' +
            tile(n(o.contracts), 'contracts', n(o.contracts_binding) + ' binding') +
            tile(n(o.contracts_confirmed), 'confirmed done') +
            tile(n(o.disputes), 'disputes', n(o.disputes_open) + ' open') +
            tile(n(o.evidence_filed), 'documents filed') +
          '</div>' +
          '<div class="head" style="margin-top:26px"><h2 style="font-size:16px">The model</h2></div>' +
          '<div class="scroll"><table><tr><th>Outcome</th><th class="n">Runs</th>' +
          '<th class="n">Confidence</th><th class="n">Latency</th><th class="n">Last</th></tr>' +
          (rows || '<tr><td colspan="5" style="color:var(--faint)">No runs yet.</td></tr>') +
          '</table></div>' +
          '<p class="lede" style="margin-top:14px;font-size:13.5px">Anything other than ' +
          '&ldquo;accepted&rdquo; is a run the pipeline refused to show anybody. They are here ' +
          'on purpose: a model that often fails validation is a signal.</p>')
      })
  }

  SECTIONS.verification = function () {
    return rpc('admin_verification_queue').then(function (rows) {
      badges.pending = rows.length
      drawTabs()

      if (!rows.length) {
        return frame('Verification', null, '<div class="empty">Nobody is waiting.</div>')
      }

      var body = rows.map(function (r) {
        return '<tr>' +
          '<td><strong>' + esc(r.legal_name) + '</strong><br>' +
          '<span class="mono">' + esc(r.email) + '</span>' +
          (r.name_differs
            ? '<br><span class="pill warn" style="margin-top:4px">name differs from account</span>'
            : '') +
          '</td>' +
          '<td>' + esc(String(r.document_kind).replace(/_/g, ' ')) + '</td>' +
          '<td>' + (r.how ? esc(r.how) : '<span style="color:var(--faint)">—</span>') + '</td>' +
          '<td class="mono">' + day(r.waiting_since) +
          (r.state === 'needs_more_info'
            ? '<br><span class="pill warn">waiting on them</span>'
            : '') + '</td>' +
          '<td><div class="row-actions">' +
          '<button class="primary" data-approve="' + r.request_id + '">Approve</button>' +
          '<button data-more="' + r.request_id + '">Ask for more</button>' +
          '<button class="danger" data-reject="' + r.request_id + '">Refuse</button>' +
          '</div></td></tr>'
      }).join('')

      return frame('Verification',
        'Every outcome needs a reason, approval included, and every reason is emailed to the ' +
        'person word for word. Asking for more hands the request back to them rather than ' +
        'closing it, and it returns here when they answer.',
        '<div class="scroll"><table><tr><th>Who</th><th>Document</th><th>How</th>' +
        '<th>Waiting since</th><th></th></tr>' + body + '</table></div>')
    })
  }

  SECTIONS.people = function (term) {
    return rpc('admin_people', { p_query: term || null, p_limit: 40 }).then(function (rows) {
      var body = rows.length ? rows.map(function (p) {
        var state = p.suspended
          ? '<span class="pill bad">suspended</span>'
          : p.verified_at
            ? '<span class="pill ok">verified</span>'
            : '<span class="pill flat">unverified</span>'
        return '<tr>' +
          '<td><strong>' + esc(p.full_name) + '</strong><br>' +
          '<span class="mono">' + esc(p.email) + '</span></td>' +
          '<td>' + state + '</td>' +
          '<td class="mono">' + day(p.joined) + '</td>' +
          '<td class="mono">' + (p.last_seen ? day(p.last_seen) : '—') + '</td>' +
          '<td class="n">' + n(p.contracts) + '</td>' +
          '<td><div class="row-actions">' +
          (p.suspended
            ? '<button data-restore="' + p.user_id + '">Restore</button>'
            : '<button class="danger" data-suspend="' + p.user_id + '">Suspend</button>') +
          '</div></td></tr>'
      }).join('') : ''

      return frame('People',
        'Opening this wrote a line saying you did. Searching writes the term as well. That log ' +
        'is append-only and you cannot read it, which is what makes showing names here ' +
        'defensible.',
        '<form class="search" id="search-form">' +
        '<input id="search" type="search" placeholder="Name or email" value="' +
        esc(term || '') + '">' +
        '<button class="primary" type="submit">Search</button>' +
        (term ? '<button type="button" id="search-clear">Clear</button>' : '') +
        '</form>' +
        (body
          ? '<div class="scroll"><table><tr><th>Who</th><th>Standing</th><th>Joined</th>' +
            '<th>Last seen</th><th class="n">Contracts</th><th></th></tr>' + body + '</table></div>'
          : '<div class="empty">' + (term ? 'Nobody matches that.' : 'No accounts yet.') + '</div>'))
    })
  }

  SECTIONS.reports = function () {
    return rpc('admin_reports', { p_state: 'open' }).then(function (rows) {
      if (!rows.length) {
        return frame('Reports', null, '<div class="empty">Nothing has been reported.</div>')
      }
      var reasons = {"abusive":"Abusive or threatening","fraud":"Fraud","impersonation":"Impersonation","illegal":"Illegal","spam":"Spam","other":"Other"}
      var body = rows.map(function (r) {
        return '<tr>' +
          '<td><span class="pill bad">' + esc(reasons[r.reason] || r.reason) + '</span></td>' +
          '<td>' + esc(r.subject_kind) + '<br><span class="mono" style="color:var(--faint)">' +
          esc(String(r.subject_id).slice(0, 8)) + '</span></td>' +
          '<td>' + (r.detail ? esc(r.detail) : '<span style="color:var(--faint)">no detail given</span>') + '</td>' +
          '<td>' + esc(r.reporter) + '</td>' +
          '<td class="mono">' + day(r.created_at) + '</td>' +
          '<td class="right">' +
          '<button class="primary" data-actioned="' + esc(r.id) + '">Actioned</button>' +
          '<button class="danger" data-dismiss="' + esc(r.id) + '">Dismiss</button>' +
          '</td></tr>'
      }).join('')

      return frame('Reports',
        'Raised by a party about a contract, a dispute or the person on the other side of it. ' +
        'The person who raised it sees the outcome but never your note, so write the note for ' +
        'the next operator.',
        '<div class="scroll"><table><tr><th>Reason</th><th>About</th><th>What they said</th>' +
        '<th>Raised by</th><th>When</th><th class="right">Decide</th></tr>' + body + '</table></div>')
    })
  }

  SECTIONS.disputes = function () {
    return rpc('admin_disputes').then(function (rows) {
      if (!rows.length) {
        return frame('Disputes', null, '<div class="empty">No disputes on real contracts.</div>')
      }
      var body = rows.map(function (d) {
        var needs = d.state === 'escalated' || d.state === 'human_review'
        return '<tr>' +
          '<td><span class="pill ' + (needs ? 'bad' : 'flat') + '">' +
          esc(String(d.state).replace(/_/g, ' ')) + '</span></td>' +
          '<td>' + esc(d.buyer_name) + ' <span style="color:var(--faint)">vs</span> ' +
          esc(d.seller_name) + '</td>' +
          '<td class="n">' + (Number(d.amount_fils) / 100).toFixed(2) + ' AED</td>' +
          '<td class="mono">' + day(d.opened_at) + '</td>' +
          '<td>' + (d.has_proposal
            ? esc(d.accepted_by) + ' of 2 accepted'
            : '<span style="color:var(--faint)">no proposal</span>') + '</td>' +
          '<td class="n">' + n(d.runs) + '</td></tr>'
      }).join('')

      return frame('Disputes',
        'Escalated cases first, because those are the ones waiting on a person. Taking one over ' +
        'is a reviewer action and happens in the app, not here.',
        '<div class="scroll"><table><tr><th>State</th><th>Between</th><th class="n">Amount</th>' +
        '<th>Opened</th><th>Proposal</th><th class="n">Runs</th></tr>' + body + '</table></div>')
    })
  }

  SECTIONS.activity = function () {
    return rpc('admin_activity', { p_limit: 60 }).then(function (rows) {
      if (!rows.length) {
        return frame('Activity', null, '<div class="empty">Nothing has happened yet.</div>')
      }
      var body = rows.map(function (a) {
        return '<tr><td class="mono">' + esc(String(a.at).slice(0, 16).replace('T', ' ')) +
          '</td><td><span class="pill flat">' + esc(a.kind) + '</span></td>' +
          '<td>' + esc(String(a.detail).replace(/_/g, ' ')) + '</td>' +
          '<td>' + esc(a.actor) + '</td></tr>'
      }).join('')

      return frame('Activity',
        'Built from the logs that exist: contract moves, dispute moves, model runs and identity ' +
        'decisions. <strong>Failed sign-ins are not here</strong>, because nothing in this schema ' +
        'records them; they live in the platform&rsquo;s own logs. This is what people did, which ' +
        'is a different thing from a security feed and is not dressed up as one.',
        '<div class="scroll"><table><tr><th>When</th><th>Kind</th><th>What</th><th>By</th></tr>' +
        body + '</table></div>')
    })
  }

  /* ---------------------------------------------------------------- *
   * Rendering, and the actions inside a section
   * ---------------------------------------------------------------- */

  function show (id, arg) {
    current = id
    drawTabs()
    $('view').innerHTML = '<div class="loading">Loading…</div>'
    SECTIONS[id](arg)
      .then(function (html) {
        $('view').innerHTML = html
        wire(id)
      })
      .catch(function (e) { $('view').innerHTML = fail(e) })
  }

  function wire (id) {
    if (id === 'people') {
      var form = $('search-form')
      if (form) {
        form.onsubmit = function (e) { e.preventDefault(); show('people', $('search').value) }
      }
      if ($('search-clear')) $('search-clear').onclick = function () { show('people') }
    }

    Array.prototype.forEach.call($('view').querySelectorAll('[data-suspend]'), function (b) {
      b.onclick = function () {
        ask({
          title: 'Suspend this account',
          body: 'They will not be able to sign in. Nothing is deleted, and no contract changes: ' +
                'the other party keeps their copy either way. What you write below is emailed ' +
                'to them word for word, and it is the only thing they have to go on, so write ' +
                'it to them rather than about them.',
          label: 'What they will be told',
          confirm: 'Suspend',
          danger: true,
        }).then(function (reason) {
          if (!reason) return
          rpc('admin_set_suspended', {
            p_user_id: b.dataset.suspend, p_suspended: true, p_reason: reason,
          }).then(function () { show('people', $('search') ? $('search').value : '') })
            .catch(function (e) { $('view').insertAdjacentHTML('afterbegin', fail(e)) })
        })
      }
    })

    Array.prototype.forEach.call($('view').querySelectorAll('[data-restore]'), function (b) {
      b.onclick = function () {
        ask({
          title: 'Let them back in',
          body: 'Signing in works again immediately, and they are emailed to say so. What you ' +
                'write below is in that email word for word.',
          label: 'What they will be told',
          confirm: 'Restore',
        }).then(function (reason) {
          if (!reason) return
          rpc('admin_set_suspended', {
            p_user_id: b.dataset.restore, p_suspended: false, p_reason: reason,
          }).then(function () { show('people', $('search') ? $('search').value : '') })
            .catch(function (e) { $('view').insertAdjacentHTML('afterbegin', fail(e)) })
        })
      }
    })

    // One function for all three, because they are one decision with three
    // answers. It goes through the operator's own session: the older
    // decide_verification is service-role only and refused every one of these
    // with "permission denied" from the day this console shipped.
    var VERDICTS = {
      approve: {
        attr: 'approve', outcome: 'approved',
        title: 'Verify this person',
        body: 'Say what you actually looked at. It is emailed to them word for word and kept ' +
              'on a record that cannot be edited afterwards.',
        label: 'What you saw', confirm: 'Verify',
      },
      more: {
        attr: 'more', outcome: 'needs_more_info',
        title: 'Ask them for more',
        body: 'The request stays open and comes back here when they answer. Write what you ' +
              'need from them, not what is missing in the abstract.',
        label: 'What you need', confirm: 'Ask',
      },
      reject: {
        attr: 'reject', outcome: 'rejected',
        title: 'Refuse this request',
        body: 'This closes it. They read this word for word and it is the only thing they ' +
              'have to act on, so write it to them rather than about them.',
        label: 'Why', confirm: 'Refuse', danger: true,
      },
    }

    Object.keys(VERDICTS).forEach(function (key) {
      var v = VERDICTS[key]
      Array.prototype.forEach.call(
        $('view').querySelectorAll('[data-' + v.attr + ']'),
        function (b) {
          b.onclick = function () {
            ask({
              title: v.title, body: v.body, label: v.label,
              confirm: v.confirm, danger: v.danger,
            }).then(function (note) {
              if (!note) return
              rpc('admin_decide_verification', {
                p_request_id: b.dataset[v.attr],
                p_outcome: v.outcome,
                p_note: note,
              }).then(function () { show('verification') })
                .catch(function (e) { $('view').insertAdjacentHTML('afterbegin', fail(e)) })
            })
          }
        },
      )
    })

    Array.prototype.forEach.call($('view').querySelectorAll('[data-actioned]'), function (b) {
      b.onclick = function () {
        ask({
          title: 'Close this as actioned',
          body: 'Say what you did about it. The note stays on the report and is what the next ' +
                'operator reads; the person who raised it is told the outcome and not the note.',
          label: 'What you did',
          confirm: 'Actioned',
        }).then(function (note) {
          if (!note) return
          rpc('admin_resolve_report', {
            p_report_id: b.dataset.actioned, p_outcome: 'actioned', p_note: note,
          }).then(function () { show('reports') })
            .catch(function (e) { $('view').insertAdjacentHTML('afterbegin', fail(e)) })
        })
      }
    })

    Array.prototype.forEach.call($('view').querySelectorAll('[data-dismiss]'), function (b) {
      b.onclick = function () {
        ask({
          title: 'Dismiss this report',
          body: 'Say why it needs nothing. A queue closed with "ok" eleven times tells the next ' +
                'person nothing, and this is the record of a judgement about somebody.',
          label: 'Why it needs nothing',
          confirm: 'Dismiss',
          danger: true,
        }).then(function (note) {
          if (!note) return
          rpc('admin_resolve_report', {
            p_report_id: b.dataset.dismiss, p_outcome: 'dismissed', p_note: note,
          }).then(function () { show('reports') })
            .catch(function (e) { $('view').insertAdjacentHTML('afterbegin', fail(e)) })
        })
      }
    })

    Array.prototype.forEach.call($('view').querySelectorAll('[data-reject]'), function (b) {
      b.onclick = function () {
        ask({
          title: 'Refuse this request',
          body: 'They read this word for word, and it is the only thing they have to act on. ' +
                'Write it to them, not about them.',
          label: 'What needs to change',
          confirm: 'Refuse',
          danger: true,
        }).then(function (reason) {
          if (!reason) return
          rpc('decide_verification', {
            p_request_id: b.dataset.reject, p_approve: false, p_note: reason,
          }).then(function () { show('verification') })
            .catch(function (e) { $('view').insertAdjacentHTML('afterbegin', fail(e)) })
        })
      }
    })
  }

  /* ---------------------------------------------------------------- *
   * Getting in
   * ---------------------------------------------------------------- */

  $('gate').addEventListener('submit', function (ev) {
    ev.preventDefault()
    $('problem').classList.add('hidden')
    $('go').disabled = true

    fetch(URL_ + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('password').value }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d } }) })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d.error_description || res.d.msg || 'Sign in refused')
        token = res.d.access_token
        $('who').textContent = (res.d.user && res.d.user.email) || ''
        $('password').value = ''
        $('gate').classList.add('hidden')
        $('shell').classList.remove('hidden')
        show('overview')
      })
      .catch(function (e) {
        $('problem').textContent = e.message
        $('problem').classList.remove('hidden')
      })
      .then(function () { $('go').disabled = false })
  })

  $('out').addEventListener('click', function () {
    token = null
    $('shell').classList.add('hidden')
    $('gate').classList.remove('hidden')
  })
})()
</script>
</body>
</html>
